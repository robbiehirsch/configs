set-option -sa terminal-overrides ",xterm*:Tc"
set -g mouse on

unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# fix escape key
set -sg escape-time 10

# Vim style pane selection (with prefix)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Start windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# colors
set -g status-style 'bg=#333333 fg=#5eacd3'

# todos
# CHANGED: lvim -> nvim
bind -r D neww -c "#{pane_current_path}" "[[ -e TODO.md ]] && nvim TODO.md || nvim ~/.dotfiles/personal/todo.md"

# ── nvim <-> tmux seamless navigation ──────────────────────────────────────
# Replaces the vim-tmux-navigator TPM plugin, which detected "is this pane
# running vim" by shelling out to `ps` and regex-matching the process name.
# That breaks under ssh, sudo, and wrapper scripts.
#
# smart-splits.nvim instead has nvim SET a tmux user option, so tmux just reads
# a flag. No guessing.
#
# If you set extras.smart_splits = false in nvim, delete this block and
# uncomment the vim-tmux-navigator plugin line below instead.
is_vim="[ #{@pane-is-vim} = 1 ]"

bind-key -n C-h if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind-key -n C-j if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind-key -n C-k if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind-key -n C-l if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'

# Resize, also crossing the nvim/tmux boundary. vim-tmux-navigator never did this.
bind-key -n M-h if-shell "$is_vim" 'send-keys M-h' 'resize-pane -L 3'
bind-key -n M-l if-shell "$is_vim" 'send-keys M-l' 'resize-pane -R 3'
bind-key -n M-Up if-shell "$is_vim" 'send-keys M-Up' 'resize-pane -U 3'
bind-key -n M-Down if-shell "$is_vim" 'send-keys M-Down' 'resize-pane -D 3'
# NOTE: M-j / M-k are deliberately left alone — nvim uses them to move lines.

# Copy mode still needs these to work inside tmux's own vi mode
bind-key -T copy-mode-vi C-h select-pane -L
bind-key -T copy-mode-vi C-j select-pane -D
bind-key -T copy-mode-vi C-k select-pane -U
bind-key -T copy-mode-vi C-l select-pane -R

# ── plugins ────────────────────────────────────────────────────────────────
set -g @catppuccin_flavour 'mocha'

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
# REMOVED: christoomey/vim-tmux-navigator — it binds the same C-hjkl keys as
# the block above and the two fight. Re-add it only if you turn smart_splits
# off in nvim (and then delete the is_vim block above).
set -g @plugin 'dreamsofcode-io/catppuccin-tmux'
set -g @plugin 'tmux-plugins/tmux-yank'
# Persist sessions across reboots — pairs well with tmux-resurrect.
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'

run '~/.tmux/plugins/tpm/tpm'

# ── copy mode ──────────────────────────────────────────────────────────────
# REMOVED: `set vi-mode` — not a real tmux option; it errors on source.
# The next line is the correct way to say it, and was already here.
set-option -g mouse on
setw -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
bind P paste-buffer
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"

# splits open in the current directory
bind % split-window -h -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# reload config
bind r source-file ~/.tmux.conf \; display "tmux.conf reloaded"
