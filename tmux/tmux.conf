set-option -sa terminal-overrides ",xterm*:Tc"
set -g mouse on

unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# fix escape key
set -sg escape-time 10

# Vim style pane selection (with prefix)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Start windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# colors — status bar styling is owned by catppuccin (see plugins section)

# todos
# CHANGED: lvim -> nvim
bind -r D neww -c "#{pane_current_path}" "[[ -e TODO.md ]] && nvim TODO.md || nvim ~/.dotfiles/personal/todo.md"

# ── nvim <-> tmux seamless navigation ──────────────────────────────────────
# Replaces the vim-tmux-navigator TPM plugin, which detected "is this pane
# running vim" by shelling out to `ps` and regex-matching the process name.
# That breaks under ssh, sudo, and wrapper scripts.
#
# smart-splits.nvim instead has nvim SET a tmux user option, so tmux just reads
# a flag. No guessing.
#
# If you set extras.smart_splits = false in nvim, delete this block and
# uncomment the vim-tmux-navigator plugin line below instead.
is_vim="[ #{@pane-is-vim} = 1 ]"

bind-key -n C-h if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind-key -n C-j if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind-key -n C-k if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind-key -n C-l if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'

# Resize, also crossing the nvim/tmux boundary. vim-tmux-navigator never did this.
bind-key -n M-h if-shell "$is_vim" 'send-keys M-h' 'resize-pane -L 3'
bind-key -n M-l if-shell "$is_vim" 'send-keys M-l' 'resize-pane -R 3'
bind-key -n M-Up if-shell "$is_vim" 'send-keys M-Up' 'resize-pane -U 3'
bind-key -n M-Down if-shell "$is_vim" 'send-keys M-Down' 'resize-pane -D 3'
# NOTE: M-j / M-k are deliberately left alone — nvim uses them to move lines.

# Copy mode still needs these to work inside tmux's own vi mode
bind-key -T copy-mode-vi C-h select-pane -L
bind-key -T copy-mode-vi C-j select-pane -D
bind-key -T copy-mode-vi C-k select-pane -U
bind-key -T copy-mode-vi C-l select-pane -R

# ── plugins ────────────────────────────────────────────────────────────────
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
# REMOVED: christoomey/vim-tmux-navigator — it binds the same C-hjkl keys as
# the block above and the two fight. Re-add it only if you turn smart_splits
# off in nvim (and then delete the is_vim block above).

# ── theme: OFFICIAL catppuccin (v2 API — totally different options from the
# old dreamsofcode-io fork; 'flavour' died with it). Pinned: v2 broke config
# compat once already, the pin makes updates deliberate.
# cpu/battery must load AFTER catppuccin (list order = TPM load order).
set -g @plugin 'catppuccin/tmux#v2.3.0'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'tmux-plugins/tmux-battery'
set -g @catppuccin_flavor 'mocha'
set -g @catppuccin_window_status_style 'rounded'
# keep the directory-based window names visible (v2 shows bare numbers otherwise)
set -g @catppuccin_window_text ' #W'
set -g @catppuccin_window_current_text ' #W'

set -g @plugin 'tmux-plugins/tmux-yank'
# Persist sessions across reboots — pairs well with tmux-resurrect.
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'
# extrakto: prefix+Tab — fzf-grab ANY token from scrollback (path, hash, url,
# error message) and paste it into your prompt. No more mouse-selecting a
# commit hash out of git log output.
set -g @plugin 'laktak/extrakto'
# fzf-url: prefix+u — pick any URL visible in scrollback, opens in browser
set -g @plugin 'wfxr/tmux-fzf-url'

run '~/.tmux/plugins/tpm/tpm'

# ── status modules (MUST stay below `run tpm`) ────────────────────────────
# Order is everything here, learned the hard way:
#   1. catppuccin (via tpm above) defines the @catppuccin_status_* variables
#   2. -agF BAKES cpu/battery module text in — leaving literal
#      #{cpu_percentage}/#{battery_percentage} placeholders in status-right
#   3. the two `run` lines below re-run the interpolation plugins, which
#      rewrite those placeholders into live #() commands
# Put these lines before tpm (or skip the runs) and you get a literal
# "#{cpu_percentage}" chip in the bar.
set -g status-left ''
set -g status-left-length 100
set -g status-right-length 100
set -gF status-right '#{E:@catppuccin_status_cpu}'
set -ag status-right '#{E:@catppuccin_status_session}'
set -agF status-right '#{E:@catppuccin_status_battery}'
set -ag status-right '#{E:@catppuccin_status_date_time}'
run '~/.tmux/plugins/tmux-cpu/cpu.tmux'
run '~/.tmux/plugins/tmux-battery/battery.tmux'

# ── copy mode ──────────────────────────────────────────────────────────────
# REMOVED: `set vi-mode` — not a real tmux option; it errors on source.
# The next line is the correct way to say it, and was already here.
set-option -g mouse on
setw -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
bind P paste-buffer
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"

# splits open in the current directory
bind % split-window -h -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# reload config
bind r source-file ~/.tmux.conf \; display "tmux.conf reloaded"

# ── project switching ────────────────────────────────────────────────────
# prefix + C-f  →  fzf popup of projects; creates-or-switches to a session
#                  per project (script lives in configs/bin/tmux-sessionizer)
# Built-ins worth remembering: prefix+s = session tree, prefix+L = last session
bind C-f display-popup -E -w 62% -h 55% "$HOME/bin/tmux-sessionizer"

# ── quality of life ──────────────────────────────────────────────────────
# Killing a session hops to the next one instead of detaching entirely.
# Essential with the sessionizer workflow: kill a finished project and land
# back in a live one.
set -g detach-on-destroy off

# Windows name themselves after the directory you're in, not the running
# program. "api | web | configs" instead of "zsh | zsh | zsh".
set -g automatic-rename on
set -g automatic-rename-format '#{b:pane_current_path}'

# Put session/window into the terminal tab title (iTerm shows it)
set -g set-titles on
set -g set-titles-string '#S · #W'

# ── popups (tmux 3.2+) ───────────────────────────────────────────────────
# prefix+g — lazygit in a popup over the current pane's repo. Close it and
# you're exactly where you were; nothing rearranges.
bind g display-popup -E -w 92% -h 90% -d "#{pane_current_path}" "lazygit"

# prefix+C-t — scratch terminal popup. Same scratch session every time, so
# whatever you left running is still there. Press prefix+C-t inside it to
# dismiss.
bind C-t if-shell -F '#{==:#{session_name},scratch}' { detach-client } { display-popup -E -w 80% -h 75% "tmux new-session -A -s scratch" }

# prefix+C-j — fuzzy-switch between EXISTING sessions only (lighter-weight
# than the sessionizer when everything's already running)
bind C-j display-popup -E -w 50% -h 45% "tmux list-sessions -F '#S' | grep -v \"^$(tmux display-message -p '#S')\$\" | fzf --reverse --prompt='session> ' | xargs -r tmux switch-client -t"
