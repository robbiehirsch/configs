c:tabular-nums}\n.lq-bar{position:relative;height:10px;border-radius:5px;background:var(--surface2);border:1px solid var(--line);overflow:hidden}\n.lq-bar i{position:absolute;inset:0 auto 0 0;width:0;background:var(--faint);border-radius:5px}\n.lq-lane.stream .lq-bar i{background:linear-gradient(90deg,rgba(95,168,199,.5),var(--sse))}\n.lq-ticks{position:relative;height:14px;margin-top:3px}\n.lq-tick{position:absolute;top:0;transform:translateX(-50%);width:1px;height:5px;background:var(--line2)}\n.lq-tick.on{background:var(--sse);box-shadow:0 0 7px var(--sse)}\n.lq-tick.warn{background:var(--red);height:8px}\n.lq-tick em{position:absolute;top:6px;left:0;transform:translateX(-50%);font:8px var(--mono);color:var(--faint);font-style:normal;white-space:nowrap}\n.lq-state{margin-top:7px;font:10.5px var(--mono);color:var(--muted);min-height:16px}\n.lq-state b{color:var(--signal)}\n.lq-state.bad b{color:#ff9d8f}\n.lq-diag{position:relative;border:1px solid var(--line);border-radius:12px;background:var(--surface);height:250px;overflow:hidden;flex:none}\n.lq-node{position:absolute;transform:translate(-50%,-50%);z-index:3;text-align:center}\n.lq-node .box{border:1px solid var(--line2);background:var(--surface2);border-radius:10px;padding:9px 14px;min-width:126px;\n  transition:border-color .2s,box-shadow .2s,background .2s}\n.lq-node .box b{display:block;font:11.5px var(--sans);font-weight:650;color:var(--text);margin-bottom:3px}\n.lq-node .box span{font:8.5px/1.5 var(--mono);color:var(--faint);display:block}\n.lq-node.pulse .box{border-color:var(--nc);background:color-mix(in srgb,var(--nc) 11%,var(--surface2));\n  box-shadow:0 0 0 1px color-mix(in srgb,var(--nc) 45%,transparent),0 0 22px color-mix(in srgb,var(--nc) 20%,transparent)}\n.lq-node .work{font:8px var(--mono);color:var(--amber);margin-top:5px;opacity:0;transition:opacity .3s}\n.lq-node .work.on{opacity:1}\n.lq-rail{position:absolute;height:1px;background:var(--line2);z-index:1}\n.lq-rail em{position:absolute;left:50%;transform:translateX(-50%);font:8.5px var(--mono);color:var(--faint);\n  font-style:normal;white-space:nowrap;background:var(--surface);padding:0 7px}\n.lq-rail em.up{bottom:5px}.lq-rail em.dn{top:5px}\n.lq-rail b{position:absolute;top:50%;transform:translateY(-50%);font:11px var(--mono);color:var(--faint);font-weight:400}\n.lq-rail b.r{right:-4px}.lq-rail b.l{left:-4px}\n.lq-open{position:absolute;height:1px;z-index:2;opacity:0;transition:opacity .35s;\n  background:repeating-linear-gradient(90deg,var(--sse) 0 6px,transparent 6px 12px)}\n.lq-open.on{opacity:.95;animation:holdPulse 1.1s linear infinite}\n.lq-pkt{position:absolute;transform:translate(-50%,-50%);z-index:4;pointer-events:none}\n.lq-pkt i{display:block;width:9px;height:9px;border-radius:50%;margin:0 auto;background:var(--pc,var(--signal));\n  box-shadow:0 0 10px 2px color-mix(in srgb,var(--pc,var(--signal)) 45%,transparent)}\n.lq-pkt span{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);font:8px var(--mono);color:var(--muted);\n  white-space:nowrap;background:rgba(10,11,13,.92);padding:1px 5px;border-radius:4px;transition:opacity .12s}\n.lq-pkt.dn span{bottom:auto;top:12px}\n.lq-pkt.near span{opacity:0}\n.lq-prog{height:6px;border-radius:3px;background:var(--surface2);border:1px solid var(--line);overflow:hidden;position:relative}\n.lq-prog i{position:absolute;inset:0 auto 0 0;width:0;background:var(--react);border-radius:3px;transition:width .35s var(--ease)}\n.lq-rowcount{display:flex;justify-content:space-between;font:10px var(--mono);color:var(--faint);margin-top:5px}\n.lq-rowcount b{color:var(--text);font-variant-numeric:tabular-nums}\n\n/* ═══════════════ SUGGEST / VALIDATE OVER SSE ═══════════════ */\n.sv-wrap{display:grid;grid-template-columns:1fr;gap:13px;flex:1;min-height:0}\n.sv-cols{display:grid;grid-template-columns:1fr 1.08fr;flex:1;min-height:0}\n.sv-cols>.sv-wire{border-top:0;border-left:1px solid var(--line);max-height:none}\n.sv-panel{border:1px solid var(--line);border-radius:13px;background:var(--surface);display:flex;flex-direction:column;overflow:hidden;min-height:0}\n.sv-panel>header{padding:9px 14px;border-bottom:1px solid var(--line);font:9.5px var(--mono);letter-spacing:.14em;\n  text-transform:uppercase;color:var(--faint);display:flex;gap:9px;align-items:center}\n.sv-panel>header i{width:7px;height:7px;border-radius:50%;background:var(--pc,var(--signal))}\n.sv-body{padding:14px;display:flex;flex-direction:column;gap:10px;min-height:0;overflow:auto}\n.sv-field{border:1px solid var(--line2);border-radius:9px;background:var(--surface2);padding:8px 12px}\n.sv-field label{display:block;font:8.5px var(--mono);letter-spacing:.14em;color:var(--faint);text-transform:uppercase;margin-bottom:4px}\n.sv-field .val{font:12.5px var(--mono);color:var(--text)}\n.sv-in{display:block;width:100%;background:transparent;border:0;outline:none;padding:0;\n  color:var(--text);font:12.5px var(--mono);caret-color:var(--signal)}\n.sv-in::placeholder{color:#4a515d}\n.sv-field:focus-within{border-color:var(--signal)}\n.sv-rule.skip{color:#4a515d}\n.sv-field .val i{display:inline-block;width:1px;height:13px;background:var(--signal);vertical-align:-2px;margin-left:1px;animation:caret 1s steps(1) infinite}\n@keyframes caret{50%{opacity:0}}\n.sv-field.pending{border-color:rgba(217,164,74,.5)}\n.sv-field.ok{border-color:rgba(111,191,139,.5)}\n.sv-field.bad{border-color:rgba(216,92,70,.55)}\n.sv-field.warn2{border-color:rgba(217,164,74,.6)}\n.sv-rules{display:flex;flex-direction:column;gap:4px;margin-top:7px}\n.sv-rule{display:flex;align-items:center;gap:8px;font:10.5px var(--mono);color:var(--faint)}\n.sv-rule .mk{width:13px;text-align:center;flex:none}\n.sv-rule.pending{color:var(--muted)}\n.sv-rule.pending .mk{color:var(--amber);animation:spinDots 1.1s steps(4) infinite}\n.sv-rule.ok{color:var(--muted)}.sv-rule.ok .mk{color:var(--green)}\n.sv-rule.bad{color:#ff9d8f}.sv-rule.bad .mk{color:var(--red)}\n.sv-rule.warn2{color:#e5c07b}.sv-rule.warn2 .mk{color:var(--amber)}\n@keyframes spinDots{to{opacity:.35}}\n.sv-tier{border:1px solid var(--line2);border-radius:9px;background:var(--surface2);padding:8px 11px;animation:frameIn .28s var(--ease)}\n.sv-tier .src{font:8.5px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--sse);margin-bottom:5px;display:flex;gap:8px}\n.sv-tier .src em{font-style:normal;color:var(--faint);margin-left:auto}\n.sv-tier ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:3px}\n.sv-tier li{font:11.5px var(--mono);color:var(--text)}\n.sv-tier li small{color:var(--faint);font-size:10px}\n.sv-wait{font:10px var(--mono);color:var(--faint);display:flex;gap:7px;align-items:center}\n.sv-wait::before{content:\"\";width:6px;height:6px;border-radius:50%;background:var(--amber);animation:spinDots .9s steps(3) infinite}\n.sv-wire{border-top:1px solid var(--line);background:#0d0f12;padding:8px 11px;flex:none;\n  max-height:158px;overflow-y:auto;display:flex;flex-direction:column;gap:2px;font:9.5px/1.6 var(--mono)}\n.sv-wire .w{position:relative;padding-left:15px;color:var(--muted);white-space:pre-wrap;word-break:break-word}\n.sv-wire .w::before{position:absolute;left:0;top:0;font-weight:700}\n.sv-wire .w.req::before{content:\"→\";color:var(--react)}\n.sv-wire .w.res::before{content:\"←\";color:var(--sse)}\n.sv-wire .w.hdr{color:#4a515d}\n.sv-wire .w.cont{color:var(--faint)}\n.sv-wire .w b{color:var(--text);font-weight:600}\n.sv-wire .w.no b{color:#ff9d8f}\n.sv-wire .w.yes b{color:var(--green)}\n.sv-foot{border-top:1px solid var(--line);padding:8px 14px;font:10px var(--mono);color:var(--faint);min-height:31px}\n.sv-foot b{color:var(--signal)}\n@media(max-width:1100px){.lq-wrap,.sv-wrap,.sv-cols,.tp-split,.tp-split.even{grid-template-columns:1fr}}\n\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n<div id=\"progress\"><\u002Fdiv>\n<nav id=\"dots\" aria-label=\"slides\"><\u002Fnav>\n<div id=\"counter\" class=\"mono\">01 / 12<\u002Fdiv>\n<div id=\"keys-hint\"><b>← →<\u002Fb> navigate &nbsp;·&nbsp; <b>P<\u002Fb> pause motion &nbsp;·&nbsp; <b>F<\u002Fb> fullscreen<\u002Fdiv>\n<div id=\"deck\">\n<!-- ════════════ SLIDE 1 · TITLE ════════════ -->\n<section class=\"slide\" id=\"s1\" data-title=\"Title\">\n  <div class=\"grid-overlay\"><\u002Fdiv>\n  <p class=\"kicker\">Internal tech talk · transports &amp; streaming UI<\u002Fp>\n  <h1>A refresher on<br><span class=\"grad\">real-time transports.<\u002Fspan><\u002Fh1>\n  <p class=\"lede\">Short polling, long polling, <b>Server-Sent Events<\u002Fb> and <b>WebSockets<\u002Fb> — the four ways to get\n  server data into a browser. What each one costs, what it asks you to build, and how to tell which one a\n  problem actually wants. Then: the architecture we landed on, and where else the same pattern pays.<\u002Fp>\n  <div class=\"pipeline\" style=\"gap:12px\">\n    <div class=\"pnode\" style=\"border-color:rgba(216,92,70,.5);flex:1\">SHORT POLLING<small>ASK ON A TIMER<\u002Fsmall><\u002Fdiv>\n    <div class=\"pnode\" style=\"border-color:rgba(217,164,74,.5);flex:1\">LONG POLLING<small>SERVER HOLDS<\u002Fsmall><\u002Fdiv>\n    <div class=\"pnode\" style=\"border-color:rgba(95,168,199,.5);flex:1\">SSE<small>ONE-WAY PUSH<\u002Fsmall><\u002Fdiv>\n    <div class=\"pnode\" style=\"border-color:rgba(156,139,208,.5);flex:1\">WEBSOCKET<small>BOTH DIRECTIONS<\u002Fsmall><\u002Fdiv>\n    <div class=\"packet ambient\"><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ════════════ SLIDE · POLLING ════════════ -->\n<section class=\"slide\" id=\"s1b\" data-title=\"Polling\" data-screen-label=\"Polling\">\n  <p class=\"kicker\">01 / Refresher · polling<\u002Fp>\n  <h2>Polling<\u002Fh2>\n  <p class=\"lede\">Polling needs nothing you don't already have — a timer and <code class=\"mono\" style=\"font-size:.85em;color:#9fd0ff\">fetch<\u002Fcode>.\n  The cost isn't the code, it's the <b>ratio<\u002Fb>: most answers carry no news, and news waits for the next tick.\n  Long polling fixes the waiting and keeps the churn.<\u002Fp>\n  <div class=\"sim\">\n    <header><span class=\"sim-tag\"><i><\u002Fi>live · kafka → cash api → polling client<\u002Fspan>\n      <span class=\"sp\"><span id=\"tp-pace-poll\"><\u002Fspan>\n      <button class=\"btn\" id=\"tp-restart-poll\">⟲ Restart simulation<\u002Fbutton><\u002Fspan><\u002Fheader>\n    <div id=\"tp-lanes-poll\"><\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"tp-split\">\n    <div class=\"tp-codes\">\n      <div class=\"code-card\" style=\"--lc:var(--red)\"><header><i><\u002Fi>short polling · the client asks on a timer<\u002Fheader><pre class=\"code\"><span class=\"c\">// a timer, a whole snapshot, and a diff you maintain<\u002Fspan>\nuseEffect(() =&gt; {\n  const id = setInterval(async () =&gt; {\n    const snap = await fetch(<span class=\"s\">\"/api/state\"<\u002Fspan>).then(r =&gt; r.json());\n    for (const [k, v] of Object.entries(snap))\n      if (!deepEqual(v, prev.current[k]))        <span class=\"c\">// what changed?<\u002Fspan>\n        dispatch({ type: k + <span class=\"s\">\"/updated\"<\u002Fspan>, payload: v });\n    prev.current = snap;\n  }, <span class=\"n\">5000<\u002Fspan>);\n  return () =&gt; clearInterval(id);\n}, []);<\u002Fpre><\u002Fdiv>\n      <div class=\"code-card\" style=\"--lc:var(--amber)\"><header><i><\u002Fi>long polling · the server holds the request<\u002Fheader><pre class=\"code\"><span class=\"c\">// better latency, same connection churn<\u002Fspan>\nasync function loop(signal) {\n  while (!signal.aborted) {\n    try {\n      const r = await fetch(<span class=\"s\">\"/api/updates?since=\"<\u002Fspan> + cursor, { signal });\n      if (r.status === <span class=\"n\">204<\u002Fspan>) continue;            <span class=\"c\">// held 30s, no news<\u002Fspan>\n      const { events, next } = await r.json();\n      cursor = next;                           <span class=\"c\">// you own the cursor<\u002Fspan>\n      events.forEach(dispatch);\n    } catch { await sleep(backoff()); }        <span class=\"c\">// …and the backoff<\u002Fspan>\n  }\n}<\u002Fpre><\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"tp-notes\" style=\"--nc:var(--red)\">\n      <div class=\"tp-note\"><span class=\"num-badge\">1<\u002Fspan><h4>You pay for silence<\u002Fh4>\n        <p>A 5-second interval is <b>720 requests an hour per open tab<\u002Fb>. On a quiet system almost every one returns a body identical to the last. Multiply by tabs, by users, by dashboards left open on a wall screen.<\u002Fp><\u002Fdiv>\n      <div class=\"tp-note\"><span class=\"num-badge\">2<\u002Fspan><h4>Latency is half the interval<\u002Fh4>\n        <p>An update that lands just after a poll waits the full period. Shorten the interval and request volume climbs linearly while freshness never beats one tick. Long polling escapes that trade — at one request per message.<\u002Fp><\u002Fdiv>\n      <div class=\"tp-note\"><span class=\"num-badge\">3<\u002Fspan><h4>The client re-derives the truth<\u002Fh4>\n        <p>The server knew exactly what changed and dropped that knowledge on the floor. Now every client diffs a whole snapshot to reconstruct it — the same work, done N times, on the slowest hardware in the system.<\u002Fp><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ════════════ SLIDE · WEBSOCKETS ════════════ -->\n<section class=\"slide\" id=\"s1ws\" data-title=\"WebSocket\" data-screen-label=\"WebSocket\">\n  <p class=\"kicker\">02 / Refresher · websockets<\u002Fp>\n  <h2>WebSockets<\u002Fh2>\n  <p class=\"lede\">WebSocket is the most capable option, and that's the problem. After the <code class=\"mono\" style=\"font-size:.85em;color:#9fd0ff\">Upgrade<\u002Fcode>\n  handshake you have a raw bidirectional pipe — everything above it (message shape, liveness, resume, reconnect) is\n  <b>yours to design, test and operate<\u002Fb>.<\u002Fp>\n  <div class=\"sim\">\n    <header><span class=\"sim-tag\"><i><\u002Fi>live · kafka → cash api → websocket<\u002Fspan>\n      <span class=\"sp\"><span id=\"tp-pace-ws\"><\u002Fspan>\n      <button class=\"btn\" id=\"tp-restart-ws\">⟲ Restart simulation<\u002Fbutton><\u002Fspan><\u002Fheader>\n    <div id=\"tp-lanes-ws\"><\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"tp-split\">\n    <div class=\"tp-codes\">\n      <div class=\"code-card\" style=\"--lc:var(--violet)\"><header><i><\u002Fi>websocket client · the transport is the easy part<\u002Fheader><pre class=\"code\"><span class=\"c\">// everything commented below is code we would own<\u002Fspan>\nconst ws = new WebSocket(<span class=\"s\">\"wss://api.internal/stream\"<\u002Fspan>);\n\nws.onopen    = () =&gt; ws.send(JSON.stringify({ sub: [<span class=\"s\">\"u:42\"<\u002Fspan>] }));  <span class=\"c\">// handshake<\u002Fspan>\nws.onmessage = e =&gt; {\n  const m = JSON.parse(e.data);\n  if (m.t === <span class=\"s\">\"pong\"<\u002Fspan>) return;                    <span class=\"c\">// liveness protocol<\u002Fspan>\n  if (m.t === <span class=\"s\">\"patch\"<\u002Fspan>) dispatch(m.action);\n};\nws.onclose   = () =&gt; { clearInterval(ping);\n                      setTimeout(connect, backoff()); }  <span class=\"c\">// reconnect<\u002Fspan>\nconst ping = setInterval(() =&gt; ws.send(<span class=\"s\">'{\"t\":\"ping\"}'<\u002Fspan>), <span class=\"n\">15000<\u002Fspan>);\n<span class=\"c\">// still to build: resume-from-cursor, dedupe, auth refresh,\n//                 sticky routing, backpressure<\u002Fspan><\u002Fpre><\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"tp-notes\" style=\"--nc:var(--violet)\">\n      <div class=\"tp-note\"><span class=\"num-badge\">1<\u002Fspan><h4>We have nothing to send<\u002Fh4>\n        <p>The dashboard is read-only on this channel. Writes go over REST — verbs, idempotency keys, auth, retries, all of it already solved. The upstream half of a socket would carry subscriptions and pings, and nothing else.<\u002Fp><\u002Fdiv>\n      <div class=\"tp-note\"><span class=\"num-badge\">2<\u002Fspan><h4>You are the protocol<\u002Fh4>\n        <p>No <code>Last-Event-ID<\u002Fcode>, no automatic retry, no defined message semantics. Each of those becomes application code — and a class of bug that only appears on flaky networks, in production, during a demo.<\u002Fp><\u002Fdiv>\n      <div class=\"tp-note\"><span class=\"num-badge\">3<\u002Fspan><h4>It reaches into the infrastructure<\u002Fh4>\n        <p><code>Upgrade<\u002Fcode> has to survive every proxy, load balancer and WAF in the path. Idle timeouts kill sockets that plain HTTP shrugs off, and long-lived connection state makes every rolling deploy visible to users.<\u002Fp><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ════════════ SLIDE · SSE ════════════ -->\n<section class=\"slide\" id=\"s1sse\" data-title=\"SSE\" data-screen-label=\"SSE\">\n  <p class=\"kicker\">03 / Refresher · server-sent events<\u002Fp>\n  <h2>Server-Sent Events<\u002Fh2>\n  <p class=\"lede\"><code class=\"mono\" style=\"font-size:.85em;color:#9fd0ff\">text/event-stream<\u002Fcode> is plain HTTP, held open. The server writes a frame\n  when it has news; the browser's <code class=\"mono\" style=\"font-size:.85em;color:#9fd0ff\">EventSource<\u002Fcode> does the parsing, the reconnect and the resume.\n  Five lines of client code — and you can read the whole wire in <code class=\"mono\" style=\"font-size:.85em;color:#9fd0ff\">curl<\u002Fcode>.<\u002Fp>\n  <div class=\"sim\">\n    <header><span class=\"sim-tag\"><i><\u002Fi>live · kafka → cash api → sse<\u002Fspan>\n      <span class=\"sp\"><span id=\"tp-pace-sse\"><\u002Fspan>\n      <button class=\"btn\" id=\"tp-restart-sse\">⟲ Restart simulation<\u002Fbutton><\u002Fspan><\u002Fheader>\n    <div id=\"tp-lanes-sse\"><\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"tp-split even\">\n    <div class=\"tp-codes\">\n      <div class=\"code-card\" style=\"--lc:var(--sse)\"><header><i><\u002Fi>the wire · readable, boring, cacheable-by-nothing<\u002Fheader><pre class=\"code\"><span class=\"c\">→ request<\u002Fspan>\nGET /stream?subscriber=u:42 HTTP/1.1\nAccept: text/event-stream\n\n<span class=\"c\">← response headers, then frames, for as long as we like<\u002Fspan>\nHTTP/1.1 200 OK\nContent-Type: text/event-stream\nCache-Control: no-cache\n\nid: 9912\nevent: patch\ndata: {\"type\":\"entitlements/updated\",\"payload\":{\"seats\":5}}\n\n: heartbeat comment — keeps idle proxies from closing us\n\nid: 9913\nevent: patch\ndata: [{\"type\":\"kv/updated\",\"payload\":{\"theme\":\"dark\"}},\ndata:  {\"type\":\"rows/appended\",\"payload\":[{\"id\":128}]}]<\u002Fpre><\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"tp-codes\">\n      <div class=\"code-card\" style=\"--lc:var(--react)\"><header><i><\u002Fi>the client · all of it<\u002Fheader><pre class=\"code\"><span class=\"c\">// this is the entire transport layer<\u002Fspan>\nconst es = new EventSource(<span class=\"s\">\"/stream?subscriber=u:42\"<\u002Fspan>);\n\nes.addEventListener(<span class=\"s\">\"patch\"<\u002Fspan>, e =&gt; {\n  const frame = JSON.parse(e.data);\n  [].concat(frame).forEach(dispatch);  <span class=\"c\">// 1 frame → n dispatches, 1 tick<\u002Fspan>\n});\n\nes.onerror = () =&gt; {};   <span class=\"c\">// nothing to do here: the browser backs off,\n                         //   retries, and replays Last-Event-ID for us<\u002Fspan><\u002Fpre><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"tp-verdict\">\n    <div class=\"v\" style=\"--vc:var(--sse)\"><b>Reconnect ships with the browser.<\u002Fb> Drop the connection and <code>EventSource<\u002Fcode> retries on its own, sending <code>Last-Event-ID<\u002Fcode> so the server resumes at the frame you missed. A <code>retry:<\u002Fcode> field tunes the delay.<\u002Fdiv>\n    <div class=\"v\" style=\"--vc:var(--sse)\"><b>It really is just HTTP.<\u002Fb> Same GET, same cookies and auth headers, same proxies, same logs and traces, HTTP/2 multiplexing for free. There is nothing new to operate.<\u002Fdiv>\n    <div class=\"v\" style=\"--vc:var(--amber)\"><b>The honest limits.<\u002Fb> Text only, server → client only, and six connections per origin on HTTP/1.1 (moot over HTTP/2). All three are things this system does not need.<\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ════════════ SLIDE · SIDE BY SIDE ════════════ -->\n<section class=\"slide\" id=\"s1cmp\" data-title=\"Side by side\" data-screen-label=\"Comparison\">\n  <p class=\"kicker\">04 / Refresher · side by side<\u002Fp>\n  <h2>Side by side<\u002Fh2>\n  <p class=\"lede\">The same update stream through all four transports. Watch the <b>request/update ratio<\u002Fb> diverge —\n  then read down the last row: for a read-only dashboard, three of these are either wasteful or over-powered.<\u002Fp>\n  <div class=\"sim\">\n    <header><span class=\"sim-tag\"><i><\u002Fi>live · four transports, one event stream<\u002Fspan>\n      <span class=\"sp\"><span id=\"tp-pace-all\"><\u002Fspan>\n      <button class=\"btn\" id=\"tp-restart-all\">⟲ Restart simulation<\u002Fbutton><\u002Fspan><\u002Fheader>\n    <div id=\"tp-lanes-all\"><\u002Fdiv>\n  <\u002Fdiv>\n  <table class=\"tport-table\">\n    <thead><tr><th><\u002Fth><th>Short polling<\u002Fth><th>Long polling<\u002Fth><th class=\"hl-col\">SSE<\u002Fth><th>WebSocket<\u002Fth><\u002Ftr><\u002Fthead>\n    <tbody>\n      <tr><td class=\"rowh\">DIRECTION<\u002Ftd><td>client asks, server answers<\u002Ftd><td>client asks, server holds<\u002Ftd><td class=\"hl-col\"><b>server → client only<\u002Fb><\u002Ftd><td>both directions<\u002Ftd><\u002Ftr>\n      <tr><td class=\"rowh\">CONNECTION<\u002Ftd><td>new request per check<\u002Ftd><td>new request per message<\u002Ftd><td class=\"hl-col\">one GET, stays open<\u002Ftd><td>one, after Upgrade handshake<\u002Ftd><\u002Ftr>\n      <tr><td class=\"rowh\">PROTOCOL<\u002Ftd><td>plain HTTP<\u002Ftd><td>plain HTTP<\u002Ftd><td class=\"hl-col\">plain HTTP · text/event-stream<\u002Ftd><td>ws:// framing, ping/pong, heartbeats<\u002Ftd><\u002Ftr>\n      <tr><td class=\"rowh\">RECONNECT / RESUME<\u002Ftd><td>n/a — stateless<\u002Ftd><td>manual re-request loop<\u002Ftd><td class=\"hl-col\"><b>built in<\u002Fb> · Last-Event-ID<\u002Ftd><td>you build it yourself<\u002Ftd><\u002Ftr>\n      <tr><td class=\"rowh\">CLIENT CODE<\u002Ftd><td>fetch + timer + diffing<\u002Ftd><td>fetch loop + state machine<\u002Ftd><td class=\"hl-col\">EventSource ≈ 5 lines<\u002Ftd><td>socket + protocol design<\u002Ftd><\u002Ftr>\n      <tr><td class=\"rowh\">FIT FOR A READ-ONLY UI<\u002Ftd><td style=\"color:var(--red)\">✗ churn &amp; latency<\u002Ftd><td style=\"color:var(--amber)\">△ works, awkward<\u002Ftd><td class=\"hl-col\" style=\"color:var(--green)\"><b>✓ built for this<\u002Fb><\u002Ftd><td style=\"color:var(--amber)\">△ power we don't need<\u002Ftd><\u002Ftr>\n    <\u002Ftbody>\n  <\u002Ftable>\n<\u002Fsection>\n\n<!-- ════════════ SLIDE 3 · WHY SSE FITS ════════════ -->\n<section class=\"slide\" id=\"s1c\" data-title=\"Why SSE fits us\">\n  <p class=\"kicker\">02 / Why SSE wins for this system<\u002Fp>\n  <h2>Half a protocol is a feature — when you only need half.<\u002Fh2>\n  <p class=\"lede\">Our UI is a <b>subscriber<\u002Fb>, not a peer. Every byte it needs flows server → client,\n  and the bytes themselves are already shaped like the thing the UI was going to build anyway: <b>Redux action payloads<\u002Fb>.<\u002Fp>\n  <div class=\"why-cards\">\n    <div class=\"why\"><span class=\"num-badge\">1<\u002Fspan><h4>One-way is exactly right<\u002Fh4>\n      <p>The dashboard never pushes data back on this channel — writes and mutations go through normal REST with verbs, auth and retries. A WebSocket's bidirectionality (and its heartbeats, backpressure and message routing) would be <b>dead weight we have to operate<\u002Fb>.<\u002Fp><\u002Fdiv>\n    <div class=\"why\"><span class=\"num-badge\">2<\u002Fspan><h4>It's just HTTP<\u002Fh4>\n      <p>A normal <code>GET<\u002Fcode> with <code>Accept: text/event-stream<\u002Fcode> — so proxies, load balancers, auth headers and cookies all work unmodified. <code>EventSource<\u002Fcode> reconnects automatically and resumes with <code>Last-Event-ID<\u002Fcode>. No upgrade handshake, no framing layer, no ping/pong.<\u002Fp><\u002Fdiv>\n    <div class=\"why\"><span class=\"num-badge\">3<\u002Fspan><h4>The payload IS the action<\u002Fh4>\n      <p>We don't ship a state snapshot and make the UI figure out what changed — the server <b>already knows<\u002Fb> what changed. Frames carry <code>{ type, payload }<\u002Fcode> deltas that map 1:1 onto action creators. The client's whole job is <code>JSON.parse → dispatch<\u002Fcode>.<\u002Fp><\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"sim grow\">\n    <header><span class=\"sim-tag\"><i><\u002Fi>live · one update, two clients<\u002Fspan>\n      <span class=\"sp\"><button class=\"btn primary\" id=\"duo-play\">▶ Deliver one update, two ways<\u002Fbutton>\n      <span class=\"stat\" id=\"duo-stat\">same update · watch which client finishes first<\u002Fspan><\u002Fspan><\u002Fheader>\n    <div class=\"duo\">\n    <div class=\"duo-panel\" id=\"duo-poll\">\n      <header>Polling client · receives a full snapshot<\u002Fheader>\n      <pre class=\"code\" id=\"duo-poll-code\"><\u002Fpre>\n      <div class=\"duo-status\" id=\"duo-poll-status\">waiting…<\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"duo-panel ssep\" id=\"duo-sse\">\n      <header>SSE client · receives the delta<\u002Fheader>\n      <pre class=\"code\" id=\"duo-sse-code\"><\u002Fpre>\n      <div class=\"duo-status\" id=\"duo-sse-status\">waiting…<\u002Fdiv>\n    <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ════════════ SLIDE · SSE → REDUX PATTERN ════════════ -->\n<section class=\"slide\" id=\"s1p\" data-title=\"SSE → Redux pattern\" data-screen-label=\"SSE to Redux pattern\">\n  <p class=\"kicker\">06 / The pattern · SSE → Redux<\u002Fp>\n  <h2>The frame <em style=\"font-style:normal;color:var(--signal)\">is<\u002Fem> the action. That's the whole contract.<\u002Fh2>\n  <p class=\"lede\">There is no adapter layer in the middle, no message-to-action mapping table, no client-side diff.\n  The gateway emits exactly what a reducer expects, and the provider's only job is <b>parse → dispatch<\u002Fb>.\n  Everything else on this slide is just the rules that keep that true.<\u002Fp>\n  <div class=\"pat-flow\">\n    <div class=\"pat-step\"><b>Gateway<\u002Fb><span>knows what<br>changed, and for whom<\u002Fspan><\u002Fdiv>\n    <div class=\"pat-arrow\">›<\u002Fdiv>\n    <div class=\"pat-step key\"><b>{ type, payload }<\u002Fb><span>one SSE frame<br>= one Redux action<\u002Fspan><\u002Fdiv>\n    <div class=\"pat-arrow\">›<\u002Fdiv>\n    <div class=\"pat-step\"><b>dispatch<\u002Fb><span>batched — array frames<br>land in one tick<\u002Fspan><\u002Fdiv>\n    <div class=\"pat-arrow\">›<\u002Fdiv>\n    <div class=\"pat-step\"><b>reducer<\u002Fb><span>merge by key<br>idempotent, order-free<\u002Fspan><\u002Fdiv>\n    <div class=\"pat-arrow\">›<\u002Fdiv>\n    <div class=\"pat-step\"><b>useSelector<\u002Fb><span>the last filter:<br>re-render or don't<\u002Fspan><\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"tp-split even\">\n    <div class=\"tp-codes\">\n      <div class=\"code-card\" style=\"--lc:var(--api)\"><header><i><\u002Fi>server · the only place that decides what an update means<\u002Fheader><pre class=\"code\"><span class=\"c\">// gateway/stream.ts<\u002Fspan>\nfunction emit(res, sub, delta) {\n  if (!passes(sub.criteria, delta)) return;      <span class=\"c\">// filter here, not in the UI<\u002Fspan>\n\n  const action = { type: delta.type,             <span class=\"c\">// ← a Redux action, verbatim<\u002Fspan>\n                   payload: delta.payload };\n\n  res.write(<span class=\"s\">\"id: \"<\u002Fspan>    + delta.rev + <span class=\"s\">\"\\n\"<\u002Fspan>);      <span class=\"c\">// = resume token<\u002Fspan>\n  res.write(<span class=\"s\">\"event: patch\\n\"<\u002Fspan>);\n  res.write(<span class=\"s\">\"data: \"<\u002Fspan>  + JSON.stringify(action) + <span class=\"s\">\"\\n\\n\"<\u002Fspan>);\n}\n\n<span class=\"c\">// a batch is the same call with an array payload —\n// atomicity survives the whole trip<\u002Fspan><\u002Fpre><\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"tp-codes\">\n      <div class=\"code-card\" style=\"--lc:var(--react)\"><header><i><\u002Fi>client · provider, ~20 lines, no per-type wiring<\u002Fheader><pre class=\"code\"><span class=\"c\">// SseProvider.tsx<\u002Fspan>\nuseEffect(() =&gt; {\n  const es = new EventSource(<span class=\"s\">\"/stream?subscriber=\"<\u002Fspan> + userId);\n\n  es.addEventListener(<span class=\"s\">\"hydrate\"<\u002Fspan>, e =&gt;                <span class=\"c\">// once, on connect<\u002Fspan>\n    dispatch({ type: <span class=\"s\">\"state/replaced\"<\u002Fspan>, payload: JSON.parse(e.data) }));\n\n  es.addEventListener(<span class=\"s\">\"patch\"<\u002Fspan>, e =&gt; {\n    const frame = JSON.parse(e.data);\n    batch(() =&gt; [].concat(frame).forEach(action =&gt; {\n      store.dispatch(action);                    <span class=\"c\">// state<\u002Fspan>\n      bus.emit(action.type, action.payload);     <span class=\"c\">// side effects<\u002Fspan>\n    }));\n  });\n\n  return () =&gt; es.close();\n}, [userId]);<\u002Fpre><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"tp-verdict\">\n    <div class=\"v\" style=\"--vc:var(--signal)\"><b>Action types are the API.<\u002Fb> <code>domain/verb<\u002Fcode>, past tense — <code>entitlements/updated<\u002Fcode>, <code>rows/appended<\u002Fcode>. A new type is a server deploy: unknown types fall through the reducer's default case and are ignored, so old clients never break.<\u002Fdiv>\n    <div class=\"v\" style=\"--vc:var(--green)\"><b>Deltas must be idempotent.<\u002Fb> A reconnect can replay a frame you already applied. Reducers merge by key and never increment blindly; <code>id:<\u002Fcode> doubles as the revision so late or duplicate frames are cheap to drop.<\u002Fdiv>\n    <div class=\"v\" style=\"--vc:var(--react)\"><b>Hydrate once, then patch.<\u002Fb> The first event carries state, everything after is a delta — the only snapshot on the wire. Two client lanes: <code>dispatch<\u002Fcode> for state, the bus for toasts and flashes.<\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ════════════ SLIDE 7 · CLIENT WIRING ════════════ -->\n<section class=\"slide\" id=\"s7\" data-title=\"Hook → store → selectors\">\n  <p class=\"kicker\">08 / The client: hook → store → selectors<\u002Fp>\n  <h2>One connection in. Selective re-renders out.<\u002Fh2>\n  <p class=\"lede\">The provider parses each frame, maps deltas to actions, and dispatches. Components\n  <code class=\"mono\" style=\"font-size:.85em;color:#9fd0ff\">useSelector<\u002Fcode> only re-render when <b>their<\u002Fb> selected value changes;\n  the event bus carries the side-effect subset. Send frames and watch the render meters — code highlights run in sync.<\u002Fp>\n  <div class=\"sim grow\">\n    <header><span class=\"sim-tag\"><i><\u002Fi>live · frames → store → selectors<\u002Fspan><\u002Fheader>\n    <div class=\"wire-wrap\">\n      <div class=\"code-stack\" id=\"code-stack\"><\u002Fdiv>\n      <div class=\"mockui\" id=\"mockui-7\" style=\"position:relative\"><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ════════════ SLIDE 8 · END TO END LIVE ════════════ -->\n<section class=\"slide\" id=\"s8\" data-title=\"End to end, live\">\n  <p class=\"kicker\">09 / End to end, live<\u002Fp>\n  <h2>The whole machine, running.<\u002Fh2>\n  <p class=\"lede\">Random updates are produced into Kafka topics, travel the full path — normalize → registry lookup → aggregate →\n  filter → SSE → hook → dispatch — and land in the UI on the right. This is the talk's closer: leave it running.<\u002Fp>\n  <div class=\"sim grow\">\n    <header><span class=\"sim-tag\"><i><\u002Fi>live · the whole machine<\u002Fspan>\n      <span class=\"sp\"><button class=\"btn primary\" id=\"e2e-play\">⏸ Pause<\u002Fbutton>\n      <button class=\"btn\" id=\"e2e-reset\">⟲ Reset<\u002Fbutton>\n      <span id=\"e2e-pace\"><\u002Fspan>\n      <span class=\"stat\" id=\"e2e-statline\">streaming…<\u002Fspan><\u002Fspan><\u002Fheader>\n  <div class=\"e2e-wrap\">\n    <div class=\"e2e-left\">\n      <div class=\"e2e-track\" id=\"e2e-track\"><\u002Fdiv>\n      <div class=\"e2e-stats\">\n        <div class=\"e2e-stat\"><div class=\"v\" id=\"st-in\">0<\u002Fdiv><div class=\"l\">updates in<\u002Fdiv><\u002Fdiv>\n        <div class=\"e2e-stat\"><div class=\"v\" id=\"st-frames\">0<\u002Fdiv><div class=\"l\">SSE frames out<\u002Fdiv><\u002Fdiv>\n        <div class=\"e2e-stat\"><div class=\"v\" id=\"st-drops\">0<\u002Fdiv><div class=\"l\">filtered out<\u002Fdiv><\u002Fdiv>\n        <div class=\"e2e-stat\"><div class=\"v\" id=\"st-dispatch\">0<\u002Fdiv><div class=\"l\">dispatches<\u002Fdiv><\u002Fdiv>\n        <div class=\"e2e-stat\"><div class=\"v sig\" id=\"st-render\">0<\u002Fdiv><div class=\"l\">re-renders<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"devlog\" id=\"e2e-log\" style=\"max-height:190px\"><\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"mockui\" id=\"mockui-8\" style=\"position:relative\"><\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ════════════ SLIDE · LONG-RUNNING QUERIES ════════════ -->\n<section class=\"slide\" id=\"s1q\" data-title=\"Long queries, live progress\" data-screen-label=\"Long queries\">\n  <p class=\"kicker\">14 / Long-running work<\u002Fp>\n  <h2>Stream the query. Don't block the button.<\u002Fh2>\n  <p class=\"lede\">No Kafka, no Redis, no registry here — <b>one client, one query, one stream<\u002Fb>. A 40-second report\n  used to mean a spinner and a bet against the load balancer's idle timeout. Kick the query off, hand back an id, then let\n  the database's own cursor drive SSE frames: the UI gets <b>rows as they materialise<\u002Fb>, progress it can trust, and a\n  cancel that reaches the query planner.<\u002Fp>\n  <div class=\"sim grow\">\n    <header><span class=\"sim-tag\"><i><\u002Fi>live · one query, one stream<\u002Fspan>\n      <span class=\"sp\"><button class=\"btn primary\" id=\"lq-run\">⏸ Pause<\u002Fbutton>\n      <button class=\"btn\" id=\"lq-reset\">⟲ Restart<\u002Fbutton>\n      <button class=\"btn warn\" id=\"lq-cancel\">✕ Cancel query<\u002Fbutton>\n      <span id=\"lq-pace\"><\u002Fspan>\n      <span class=\"stat\" id=\"lq-stat\">streaming · time-compressed<\u002Fspan><\u002Fspan><\u002Fheader>\n  <div class=\"lq-wrap\">\n    <div class=\"lq-left\">\n      <div class=\"lq-diag\" id=\"lq-diag\"><\u002Fdiv>\n      <div class=\"lq-lane\">\n        <header><b style=\"color:var(--faint)\">If it were one round trip<\u002Fb><span>request → 42s → response<\u002Fspan><span class=\"clk\" id=\"lq-clk-a\">0.0s<\u002Fspan><\u002Fheader>\n        <div class=\"lq-bar\"><i id=\"lq-fill-a\"><\u002Fi><\u002Fdiv>\n        <div class=\"lq-ticks\"><span class=\"lq-tick warn\" style=\"left:71.4%\" id=\"lq-tick-to\"><em>30s · typical LB idle timeout<\u002Fem><\u002Fspan><\u002Fdiv>\n        <div class=\"lq-state\" id=\"lq-state-a\">connection open · nothing to render<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"lq-lane stream\">\n        <header><b style=\"color:var(--sse)\">What the user actually sees<\u002Fb><span>frames as work completes<\u002Fspan><span class=\"clk\" id=\"lq-clk-b\">0.0s<\u002Fspan><\u002Fheader>\n        <div class=\"lq-bar\"><i id=\"lq-fill-b\"><\u002Fi><\u002Fdiv>\n        <div class=\"lq-ticks\" id=\"lq-ticks-b\"><\u002Fdiv>\n        <div class=\"lq-state\" id=\"lq-state-b\">waiting for the first frame…<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"tp-verdict\" style=\"margin-top:2px\">\n        <div class=\"v\" style=\"--vc:var(--sse)\"><b>The heartbeat is the keep-alive.<\u002Fb> A <code>:<\u002Fcode> comment every few seconds stops proxies reaping a stream that is legitimately still working.<\u002Fdiv>\n        <div class=\"v\" style=\"--vc:var(--green)\"><b>Cancel reaches the database.<\u002Fb> <code>es.close()<\u002Fcode> → the API's <code>req.on(\"close\")<\u002Fcode> → <code>CLOSE cursor<\u002Fcode>. The query stops; nothing is left to reap.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"mockui\" id=\"lq-ui\" style=\"position:relative\">\n      <header><span class=\"num-badge\">▣<\u002Fspan><span class=\"url\">app.internal/reports/q_7f3 · new EventSource(…/stream)<\u002Fspan><\u002Fheader>\n      <div class=\"body\">\n        <div class=\"mcard\" id=\"lq-card\" style=\"flex:none\">\n          <h6>Q4 revenue by region · 18.4k rows estimated<\u002Fh6>\n          <div class=\"lq-prog\"><i id=\"lq-prog\"><\u002Fi><\u002Fdiv>\n          <div class=\"lq-rowcount\"><span id=\"lq-stage\">idle<\u002Fspan><span>rows <b id=\"lq-rows\">0<\u002Fb> / ~18,400<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"mtable\" id=\"lq-table\">\n          <table><thead><tr><th>REGION<\u002Fth><th>PERIOD<\u002Fth><th>REVENUE<\u002Fth><\u002Ftr><\u002Fthead><tbody id=\"lq-tbody\">\n            <tr><td colspan=\"3\" style=\"color:var(--faint)\">no rows yet — but the page is interactive<\u002Ftd><\u002Ftr>\n          <\u002Ftbody><\u002Ftable>\n        <\u002Fdiv>\n        <div class=\"devlog\" id=\"lq-log\" style=\"flex:1;max-height:none;min-height:110px\"><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ════════════ SLIDE · SUGGEST & VALIDATE ════════════ -->\n<section class=\"slide\" id=\"s1r\" data-title=\"Suggest &amp; validate over SSE\" data-screen-label=\"Suggest and validate\">\n  <p class=\"kicker\">15 / Where else this pays<\u002Fp>\n  <h2>If the server already knows the answer, stop making the client work it out.<\u002Fh2>\n  <p class=\"lede\">Autocomplete and form validation have the same shape as the dashboard: the server holds the data\n  <b>and the rules<\u002Fb>, the client holds a text box. Streaming the answers back means no dataset in the bundle, no\n  duplicated ruleset, and <b>partial results the moment they exist<\u002Fb> instead of one late, complete reply.<\u002Fp>\n  <div class=\"sim grow\">\n    <header><span class=\"sim-tag\"><i><\u002Fi>live · type to open a stream<\u002Fspan>\n      <span class=\"sp\"><button class=\"btn primary\" id=\"sv-play\">▶ Autotype an example<\u002Fbutton>\n      <button class=\"btn\" id=\"sv-clear\">⟲ Clear<\u002Fbutton>\n      <span class=\"stat\" id=\"sv-stat\">type in either panel — the wire pane beside it is the real exchange<\u002Fspan><\u002Fspan><\u002Fheader>\n  <div class=\"sv-wrap\">\n    <div class=\"sv-panel\" style=\"--pc:var(--sse)\">\n      <header><i><\u002Fi>GET /suggest?q=… · text/event-stream<\u002Fheader>\n      <div class=\"sv-cols\">\n        <div class=\"sv-body\">\n          <div class=\"sv-field\" id=\"sv-input\"><label>Customer — type here<\u002Flabel>\n            <input class=\"sv-in\" id=\"sv-q\" type=\"text\" placeholder=\"try: acme nor\" autocomplete=\"off\" spellcheck=\"false\"><\u002Fdiv>\n          <div id=\"sv-results\" style=\"display:flex;flex-direction:column;gap:8px\"><\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"sv-wire\" id=\"sv-wire-a\"><div class=\"w hdr\">nothing on the wire yet<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"sv-foot\" id=\"sv-foot-a\">idle · no request in flight<\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"sv-panel\" style=\"--pc:var(--green)\">\n      <header><i><\u002Fi>GET /validate/checkout · text/event-stream<\u002Fheader>\n      <div class=\"sv-cols\">\n        <div class=\"sv-body\" id=\"sv-form\">\n          <div class=\"sv-field\" data-f=\"email\"><label>Work email<\u002Flabel>\n            <input class=\"sv-in\" type=\"text\" placeholder=\"ada@lovelace.io\" autocomplete=\"off\" spellcheck=\"false\"><div class=\"sv-rules\"><\u002Fdiv><\u002Fdiv>\n          <div class=\"sv-field\" data-f=\"vat\"><label>VAT number<\u002Flabel>\n            <input class=\"sv-in\" type=\"text\" placeholder=\"GB-8842-11\" autocomplete=\"off\" spellcheck=\"false\"><div class=\"sv-rules\"><\u002Fdiv><\u002Fdiv>\n          <div class=\"sv-field\" data-f=\"seats\"><label>Seats<\u002Flabel>\n            <input class=\"sv-in\" type=\"text\" placeholder=\"12\" autocomplete=\"off\" spellcheck=\"false\"><div class=\"sv-rules\"><\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"sv-wire\" id=\"sv-wire-b\"><div class=\"w hdr\">nothing on the wire yet<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"sv-foot\" id=\"sv-foot-b\">idle · the browser holds no rules<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"tp-verdict\">\n    <div class=\"v\" style=\"--vc:var(--sse)\"><b>One endpoint per intent.<\u002Fb> <code>/suggest<\u002Fcode>, <code>/validate<\u002Fcode> — the client posts the raw input and renders whatever comes back. No search index in memory, no regex zoo in the bundle.<\u002Fdiv>\n    <div class=\"v\" style=\"--vc:var(--green)\"><b>Rules stay where they're enforced.<\u002Fb> The server has to validate on submit anyway; streaming that same code path to the field means one implementation and no drift between them.<\u002Fdiv>\n    <div class=\"v\" style=\"--vc:var(--amber)\"><b>Partial answers are the product.<\u002Fb> A cached hit in 120 ms beats a complete answer in 900 ms, and the stream keeps refining it — cheap tiers first, expensive lookups when they land.<\u002Fdiv>\n    <div class=\"v\" style=\"--vc:var(--react)\"><b>Cancel is free.<\u002Fb> The next keystroke closes the previous stream, so the server abandons that query and a stale response can never overtake a newer one.<\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ════════════ SLIDE 9 · COMPANION DEMO ════════════ -->\n<section class=\"slide\" id=\"s9\" data-title=\"Live companion demo\">\n  <p class=\"kicker\">10 / Your turn: the live demo<\u002Fp>\n  <h2>Same architecture, running in a real React app.<\u002Fh2>\n  <p class=\"demo-note\"><span class=\"chip\"><i><\u002Fi>sse-redux-demo.html<\u002Fspan>\n  Keep that file in the same folder as this deck. It loads React from a CDN, so the one machine that shows it needs internet once; the simulated stream itself is fully local.<\u002Fp>\n  <div class=\"demo-frame\"><iframe id=\"demo-frame\" data-src=\"sse-redux-demo.html\" title=\"SSE → Redux demo\"><\u002Fiframe><\u002Fdiv>\n<\u002Fsection>\n\n<!-- ════════════ SLIDE 10 · RECAP ════════════ -->\n<section class=\"slide\" id=\"s10\" data-title=\"Recap\">\n  <p class=\"kicker\">11 / Recap<\u002Fp>\n  <h2>Six things to remember when you build this.<\u002Fh2>\n  <div class=\"recap\" style=\"margin-top:22px\">\n    <div class=\"take\"><span class=\"num-badge\">1<\u002Fspan><div><h4>SSE is the default for a read-only UI<\u002Fh4>\n      <p>One-way, plain HTTP, reconnect and resume in the browser. Reach for WebSocket only when the client genuinely has something to say back on the same channel.<\u002Fp><\u002Fdiv><\u002Fdiv>\n    <div class=\"take\"><span class=\"num-badge\">2<\u002Fspan><div><h4>The frame is the action<\u002Fh4>\n      <p>The server emits <code>{ type, payload }<\u002Fcode> and the client's whole transport layer is <code>parse → dispatch<\u002Fcode>. No adapter layer, no snapshot diffing, no mapping table to keep in step.<\u002Fp><\u002Fdiv><\u002Fdiv>\n    <div class=\"take\"><span class=\"num-badge\">3<\u002Fspan><div><h4>Filter on the server, not the client<\u002Fh4>\n      <p>Subscriber criteria live in the gateway. A phone on 4G never pays the bandwidth for updates it would have thrown away anyway.<\u002Fp><\u002Fdiv><\u002Fdiv>\n    <div class=\"take\"><span class=\"num-badge\">4<\u002Fspan><div><h4>Array frames = atomic batches<\u002Fh4>\n      <p>A multi-delta Kafka record becomes <b>one<\u002Fb> SSE frame. All its dispatches land in the same tick, so the UI never paints a half-applied batch.<\u002Fp><\u002Fdiv><\u002Fdiv>\n    <div class=\"take\"><span class=\"num-badge\">5<\u002Fspan><div><h4>Two lanes on the client<\u002Fh4>\n      <p><code>dispatch<\u002Fcode> feeds the store (state); the event bus feeds side effects (toasts, flashes). State subscribers and event listeners evolve independently.<\u002Fp><\u002Fdiv><\u002Fdiv>\n    <div class=\"take\"><span class=\"num-badge\">6<\u002Fspan><div><h4>useSelector is the last filter<\u002Fh4>\n      <p>Even after the server's filter, components re-render only when <b>their selected slice<\u002Fb> changes. Filtering happens at every layer — bandwidth, frames, dispatches, renders.<\u002Fp><\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv>\n  <p class=\"lede\" style=\"margin-top:auto;padding-top:30px\">Questions? — and the whole deck runs offline, so feel free to poke at it during Q&amp;A.<\u002Fp>\n<\u002Fsection>\n<\u002Fdiv><!-- /deck -->\n<script>\n\"use strict\";\n/* ═══════════════ CORE UTILITIES ═══════════════ */\nconst $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];\nconst REDUCED=matchMedia(\"(prefers-reduced-motion: reduce)\").matches;\nconst esc=s=>s.replace(/&/g,\"&amp;\").replace(/<\u002Fg,\"&lt;\").replace(/>/g,\"&gt;\");\nconst clamp=(v,a,b)=>Math.max(a,Math.min(b,v));\nconst easeOut=p=>1-Math.pow(1-p,3);\nfunction center(el){const r=el.getBoundingClientRect();return{x:r.left+r.width/2,y:r.top+r.height/2};}\nfunction flyEl(el,from,to,dur,arc=0){return new Promise(res=>{const t0=performance.now();\n  (function step(now){const p=Math.min(1,(now-t0)/dur),e=easeOut(p);\n    el.style.left=(from.x+(to.x-from.x)*e)+\"px\";\n    el.style.top=(from.y+(to.y-from.y)*e-Math.sin(e*Math.PI)*arc)+\"px\";\n    if(p<1)requestAnimationFrame(step);else res();})(t0);});}\n\n/* deck navigation */\nconst deck=$(\"#deck\"),slides=$$(\".slide\"),dotsNav=$(\"#dots\");\nslides.forEach((s,i)=>{const a=document.createElement(\"a\");a.href=\"#\";\n  a.innerHTML='<span>'+String(i+1).padStart(2,\"0\")+\" · \"+esc(s.dataset.title)+\"<\u002Fspan>\";\n  a.addEventListener(\"click\",e=>{e.preventDefault();go(i);});dotsNav.appendChild(a);});\n/* auto-number kickers + counter so slides can be added or reordered freely */\n(function(){let n=0;slides.forEach(s=>{const k=$(\".kicker\",s);if(!k)return;\n  const m=k.innerHTML.match(/^\\s*\\d+\\s*\\/\\s*([\\s\\S]*)$/);\n  if(m){n++;k.innerHTML=String(n).padStart(2,\"0\")+\" / \"+m[1];}});\n  $(\"#counter\").textContent=\"01 / \"+String(slides.length).padStart(2,\"0\");})();\nlet cur=0;\nfunction go(i){cur=clamp(i,0,slides.length-1);slides[cur].scrollIntoView({behavior:REDUCED?\"auto\":\"smooth\"});}\nconst visIO=new IntersectionObserver(es=>{es.forEach(en=>{en.target._vis=en.intersectionRatio>.25;\n  if(en.intersectionRatio>.55){cur=slides.indexOf(en.target);\n    $$(\"#dots a\").forEach((a,i)=>a.classList.toggle(\"on\",i===cur));\n    $(\"#counter\").textContent=String(cur+1).padStart(2,\"0\")+\" / \"+String(slides.length).padStart(2,\"0\");}});},\n  {root:deck,threshold:[.25,.55]});\nslides.forEach(s=>visIO.observe(s));\ndeck.addEventListener(\"scroll\",()=>{const p=deck.scrollTop/(deck.scrollHeight-deck.clientHeight);\n  $(\"#progress\").style.width=(p*100).toFixed(2)+\"%\";},{passive:true});\naddEventListener(\"keydown\",e=>{\n  if(e.target.matches(\"input,select,textarea\"))return;\n  if([\"ArrowDown\",\"ArrowRight\",\"PageDown\",\" \"].includes(e.key)){e.preventDefault();go(cur+1);}\n  else if([\"ArrowUp\",\"ArrowLeft\",\"PageUp\"].includes(e.key)){e.preventDefault();go(cur-1);}\n  else if(e.key===\"Home\")go(0);else if(e.key===\"End\")go(slides.length-1);\n  else if(e.key===\"p\"||e.key===\"P\"){const p=pausables.get(slides[cur]);if(p)p.toggle();}\n  else if(e.key===\"f\"||e.key===\"F\"){document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();}});\n\n/* master animation clock: one rAF, per-slide loops gated by visibility */\nconst loops=[],pausables=new Map();\nfunction addLoop(slide,fn){loops.push({slide,fn});}\nfunction registerPausable(slide,api){pausables.set(slide,{...api,toggle(){api.setPaused(!api.getPaused());}});}\n(function master(){let last=performance.now();\n  (function fr(now){const dt=Math.min(60,now-last);last=now;\n    for(const l of loops)if(l.slide._vis&&!document.hidden){try{l.fn(dt);}catch(err){console.error(err);}}\n    requestAnimationFrame(fr);})(last);})();\n\n/* pace control: speed slider (10–100%, never faster) + click-to-step mode */\nfunction makePace(host,{onSpeed,onStepMode,onStep}={}){\n  host.classList.add(\"pace\");\n  host.innerHTML=\n   '<span class=\"pace-lbl\">SPEED<\u002Fspan>'+\n   '<span class=\"pace-sliderwrap\"><input type=\"range\" min=\"10\" max=\"100\" step=\"5\" value=\"25\" aria-label=\"animation speed\">'+\n   '<span class=\"pace-ticks\"><i>10%<\u002Fi><i>50%<\u002Fi><i>100%<\u002Fi><\u002Fspan><\u002Fspan>'+\n   '<span class=\"pace-val\">25%<\u002Fspan>'+\n   '<button class=\"btn pace-mode\" title=\"Pause auto-play and advance one step per click\">⏯ click-to-step<\u002Fbutton>'+\n   '<button class=\"btn pace-step\" disabled>Step ⟩<\u002Fbutton>';\n  const range=$(\"input\",host),val=$(\".pace-val\",host),modeBtn=$(\".pace-mode\",host),stepBtn=$(\".pace-step\",host);\n  let stepMode=false;\n  range.style.setProperty(\"--fill\",(((+range.value-10)/90)*100)+\"%\");\n  onSpeed&&onSpeed(+range.value/100);\n  range.addEventListener(\"input\",()=>{const p=+range.value;val.textContent=p+\"%\";\n    range.style.setProperty(\"--fill\",(((p-10)/90)*100)+\"%\");onSpeed&&onSpeed(p/100);});\n  modeBtn.addEventListener(\"click\",()=>{stepMode=!stepMode;\n    modeBtn.classList.toggle(\"on\",stepMode);\n    modeBtn.textContent=stepMode?\"⏯ stepping\":\"⏯ click-to-step\";\n    stepBtn.disabled=!stepMode;\n    onStepMode&&onStepMode(stepMode);});\n  stepBtn.addEventListener(\"click\",()=>onStep&&onStep());\n  return{isStep:()=>stepMode,exitStep(){if(stepMode)modeBtn.click();}};}\n\n/* ═══════════════ MINI REDUX + MOCK UI FACTORY (slides 7 & 8) ═══════════════ */\nfunction createStore(reducer,initial){let s=initial;const subs=new Set();\n  return{getState:()=>s,subscribe(f){subs.add(f);return()=>subs.delete(f);},\n    dispatch(a){s=reducer(s,a);subs.forEach(f=>f());return a;}};}\nfunction miniReducer(state,action){switch(action.type){\n  case\"entitlements/updated\":return{...state,entitlements:{...state.entitlements,...action.payload}};\n  case\"kv/updated\":return{...state,kv:{...state.kv,...action.payload}};\n  case\"table/rowsAppended\":return{...state,table:{rows:[...state.table.rows,...action.payload]}};\n  default:return state;}}\nconst HANDLERS={entitlement:p=>({type:\"entitlements/updated\",payload:p}),\n  kv:p=>({type:\"kv/updated\",payload:p}),rows:p=>({type:\"table/rowsAppended\",payload:p})};\nconst actionsFor=deltas=>deltas.map(d=>HANDLERS[d.type]&&HANDLERS[d.type](d.payload)).filter(Boolean);\n\nlet rowSeq=100;\nconst NAMES=[\"Acme\",\"Globex\",\"Initech\",\"Umbrella\",\"Hooli\",\"Stark\",\"Wayne\",\"Wonka\",\"Cyberdyne\",\"Tyrell\",\"Soylent\",\"Aperture\",\"Vandelay\",\"Pied Piper\"];\nconst rand=a=>a[Math.floor(Math.random()*a.length)];\nconst makeRows=n=>Array.from({length:n},()=>({id:++rowSeq,name:rand(NAMES)}));\nconst FRAMES={\n  grant:()=>({type:\"entitlement\",payload:{pro:true,seats:5}}),\n  revoke:()=>({type:\"entitlement\",payload:{pro:false}}),\n  seats:()=>({type:\"entitlement\",payload:{seats:3+Math.floor(Math.random()*10)}}),\n  theme:()=>({type:\"kv\",payload:{theme:rand([\"dark\",\"light\",\"solarized\",\"contrast\"])}}),\n  smallRows:()=>({type:\"rows\",payload:makeRows(1+Math.floor(Math.random()*2))}),\n  bigBatch:()=>({type:\"rows\",payload:makeRows(10+Math.floor(Math.random()*5))}),\n  combo:()=>[{type:\"entitlement\",payload:{pro:true}},{type:\"rows\",payload:makeRows(2)}]};\nconst fmtTime=()=>{const d=new Date();return d.toLocaleTimeString([],{hour12:false})+\".\"+String(d.getMilliseconds()).padStart(3,\"0\");};\n\nfunction mountMockUI(root,opts={}){\n  root.innerHTML=\n   '<header><span class=\"num-badge\">▣<\u002Fspan><span class=\"url\">app.internal/dashboard · new EventSource(\"/stream?subscriber=u:42\")<\u002Fspan><\u002Fheader>'+\n   '<div class=\"body\">'+\n   (opts.controls?'<div class=\"mock-controls\">'+\n     '<button class=\"btn\" data-f=\"grant\">Grant Pro<\u002Fbutton><button class=\"btn\" data-f=\"revoke\">Revoke Pro<\u002Fbutton>'+\n     '<button class=\"btn\" data-f=\"seats\">Change seats<\u002Fbutton><button class=\"btn\" data-f=\"theme\">Change theme<\u002Fbutton>'+\n     '<button class=\"btn\" data-f=\"smallRows\">Add row<\u002Fbutton><button class=\"btn\" data-f=\"bigBatch\">Add 10+ rows<\u002Fbutton>'+\n     '<button class=\"btn\" data-f=\"combo\">Combo frame<\u002Fbutton><\u002Fdiv>':\"\")+\n   '<div class=\"mrow\">'+\n     '<div class=\"mcard\" data-c=\"pro\"><span class=\"meter\">rendered ×0<\u002Fspan><h6>ProBadge — entitlements.pro<\u002Fh6><span class=\"mbadge off\">FREE<\u002Fspan><\u002Fdiv>'+\n     '<div class=\"mcard\" data-c=\"seats\"><span class=\"meter\">rendered ×0<\u002Fspan><h6>SeatCounter — entitlements.seats<\u002Fh6><div class=\"big\">—<\u002Fdiv><\u002Fdiv>'+\n     '<div class=\"mcard\" data-c=\"theme\"><span class=\"meter\">rendered ×0<\u002Fspan><h6>ThemeIndicator — kv.theme<\u002Fh6><div class=\"big\">default<\u002Fdiv><\u002Fdiv>'+\n   '<\u002Fdiv>'+\n   '<div class=\"mtable\"><span class=\"meter\">rendered ×0<\u002Fspan><h6 style=\"margin:0 0 6px;font:9px var(--mono);letter-spacing:.1em;color:var(--faint);text-transform:uppercase\">DataTable — table.rows (<span class=\"rc\">0<\u002Fspan>)<\u002Fh6>'+\n     '<table><thead><tr><th>ID<\u002Fth><th>NAME<\u002Fth><\u002Ftr><\u002Fthead><tbody><tr><td colspan=\"2\" style=\"color:var(--faint)\">no rows yet<\u002Ftd><\u002Ftr><\u002Ftbody><\u002Ftable><\u002Fdiv>'+\n   (opts.log?'<div class=\"devlog\"><\u002Fdiv>':\"\")+\n   '<\u002Fdiv><div class=\"mtoasts\"><\u002Fdiv>';\n  const store=createStore(miniReducer,{entitlements:{pro:false,seats:null},kv:{theme:\"default\"},table:{rows:[]}});\n  const bus=new Map();\n  const emit=(t,p)=>{(bus.get(t)||[]).forEach(f=>{try{f(p);}catch(e){console.error(e);}});};\n  const on=(t,f)=>{if(!bus.has(t))bus.set(t,[]);bus.get(t).push(f);};\n  const counts={renders:0,dispatches:0,frames:0};\n  const logEl=$(\".devlog\",root);\n  function log(html,cls){if(!logEl)return;const d=document.createElement(\"div\");d.className=\"dl \"+(cls||\"\");\n    d.innerHTML='<span class=\"ts\">'+fmtTime()+\"<\u002Fspan>\"+html;logEl.prepend(d);\n    while(logEl.children.length>30)logEl.lastChild.remove();}\n  /* selective subscription: re-render only when selected value changes */\n  function connect(selector,render,cardSel){\n    const card=$(cardSel,root),meter=$(\".meter\",card);let cur=selector(store.getState()),n=0;\n    function paint(first){n++;counts.renders++;meter.textContent=\"rendered ×\"+n;\n      render(cur);\n      if(!first){card.classList.add(\"rendered\");setTimeout(()=>card.classList.remove(\"rendered\"),480);}}\n    paint(true);\n    store.subscribe(()=>{const n=selector(store.getState());\n      if(JSON.stringify(n)!==JSON.stringify(cur)){cur=n;paint(false);}});}\n  connect(s=>s.entitlements.pro,v=>{$(\".mbadge\",root).className=\"mbadge\"+(v?\"\":\" off\");$(\".mbadge\",root).textContent=v?\"PRO\":\"FREE\";},'[data-c=\"pro\"]');\n  connect(s=>s.entitlements.seats,v=>{$('[data-c=\"seats\"] .big',root).textContent=v??\"—\";},'[data-c=\"seats\"]');\n  connect(s=>s.kv.theme,v=>{$('[data-c=\"theme\"] .big',root).textContent=v;},'[data-c=\"theme\"]');\n  const flashIds=new Set();\n  connect(s=>s.table.rows,rows=>{$(\".rc\",root).textContent=rows.length;\n    const tb=$(\".mtable tbody\",root);const shown=rows.slice(-8).reverse();\n    tb.innerHTML=shown.length?shown.map(r=>'<tr class=\"'+(flashIds.has(r.id)?\"flash\":\"\")+'\"><td>'+r.id+\"<\u002Ftd><td>\"+esc(r.name)+\"<\u002Ftd><\u002Ftr>\").join(\"\")\n      :'<tr><td colspan=\"2\" style=\"color:var(--faint)\">no rows yet<\u002Ftd><\u002Ftr>';},\".mtable\");\n  /* toasts: the side-effect SUBSET, driven by the bus not the store */\n  function toast(msg,tone){const t=document.createElement(\"div\");t.className=\"mtoast \"+tone;t.textContent=msg;\n    $(\".mtoasts\",root).appendChild(t);setTimeout(()=>t.remove(),3400);}\n  on(\"entitlement\",e=>{if(e.pro===false)toast(\"Your Pro access was revoked\",\"warn\");\n    else if(e.pro===true)toast(\"Pro features unlocked\",\"success\");});\n  on(\"rows\",rows=>{rows.forEach(r=>flashIds.add(r.id));setTimeout(()=>flashIds.clear(),1100);\n    if(rows.length>=10)toast(rows.length+\" new records loaded\",\"info\");});\n  /* the \"SSE hook\": one frame in → log, parse, dispatch, emit */\n  function frame(dataString){\n    counts.frames++;\n    log('<b>SSE frame<\u002Fb> '+esc(dataString),\"frame\");\n    let msg;try{msg=JSON.parse(dataString);}catch{return;}\n    const deltas=Array.isArray(msg)?msg:[msg];\n    actionsFor(deltas).forEach(a=>{counts.dispatches++;\n      log(\"dispatch <b>\"+esc(a.type)+\"<\u002Fb> \"+esc(JSON.stringify(a.payload)),\n        a.type.startsWith(\"entitlements\")?\"ent\":a.type.startsWith(\"kv\")?\"kv\":\"tab\");\n      store.dispatch(a);});\n    deltas.forEach(d=>emit(d.type,d.payload));}\n  if(opts.controls)$$(\".mock-controls .btn\",root).forEach(b=>\n    b.addEventListener(\"click\",()=>frame(JSON.stringify(FRAMES[b.dataset.f]()))));\n  return{store,frame,counts,toast,log};}\n<\u002Fscript>\n<script>\n\"use strict\";\n/* ═══════════════ SLIDE 7 — CLIENT WIRING ═══════════════ */\n(function(){\n  const slide=$(\"#s7\"),stack=$(\"#code-stack\");\n  const CARDS=[\n   {lc:\"var(--react)\",title:\"SSEProvider · the single door\",lines:[\n    {t:\"function SSEProvider({ connection, children }) {\"},\n    {t:\"  const store = useContext(StoreContext)\"},\n    {t:\"  const bus = useMemo(() => createEventBus(), [])\"},\n    {t:\"  useEffect(() => {\"},\n    {t:\"    connection.onmessage = (e) => {\",ph:\"recv\"},\n    {t:\"      store.logStream(e.data)                       // devtools\",ph:\"recv\"},\n    {t:\" $(\"pre\",d)};});\n  function renderCode(active){\n    cardEls.forEach(({card,pre})=>{\n      pre.innerHTML=card.lines.map(l=>\n        l.ph&&active.includes(l.ph)?'<span class=\"hl\">'+esc(l.t)+\"<\u002Fspan>\":esc(l.t)).join(\"\\n\");});}\n  renderCode([]);\n  const ui7=mountMockUI($(\"#mockui-7\"),{controls:false,log:true});\n  const ctrl=document.createElement(\"div\");ctrl.className=\"mock-controls\";\n  const PHASES=[[\"recv\"],[\"parse\"],[\"map\"],[\"dispatch\"],[\"selector\",\"bus\"]];\n  let seqToken=0;\n  [[\"grant\",\"Grant Pro\"],[\"revoke\",\"Revoke Pro\"],[\"seats\",\"Change seats\"],[\"theme\",\"Change theme\"],\n   [\"smallRows\",\"Add row\"],[\"bigBatch\",\"Add 10+ rows\"],[\"combo\",\"Combo frame\"]].forEach(([k,label])=>{\n    const b=document.createElement(\"button\");b.className=\"btn\";b.textContent=label;\n    b.addEventListener(\"click\",()=>sendFrame(k));ctrl.appendChild(b);});\n  $(\"#mockui-7 .body\").prepend(ctrl);\n  function sendFrame(k){\n    const json=JSON.stringify(FRAMES[k]());const tok=++seqToken;let i=0;\n    (function next(){if(tok!==seqToken)return;\n      if(i<PHASES.length){renderCode(PHASES[i]);\n        if(PHASES[i][0]===\"dispatch\")ui7.frame(json);\n        i++;setTimeout(next,380);}\n      else setTimeout(()=>{if(tok===seqToken)renderCode([]);},1100);})();}\n})();\n\n/* ═══════════════ SLIDE 8 — END TO END, LIVE ═══════════════ */\n(function(){\n  const slide=$(\"#s8\"),track=$(\"#e2e-track\"),logEl=$(\"#e2e-log\");\n  const NODES=[\n    {id:\"prod\",x:6.5,label:\"producers\",sub:\"svc a · b · c\",c:\"var(--kafka)\"},\n    {id:\"kafka\",x:19,label:\"Kafka\",sub:\"×N topics\",c:\"var(--kafka)\"},\n    {id:\"norm\",x:31.5,label:\"normalize\",sub:\"envelope\",c:\"var(--api)\"},\n    {id:\"redis\",x:44,label:\"Redis lookup\",sub:\"subs:&lt;topic&gt;\",c:\"var(--redis)\"},\n    {id:\"agg\",x:56.5,label:\"aggregate\",sub:\"per tick\",c:\"var(--api)\"},\n    {id:\"filt\",x:69,label:\"filter\",sub:\"types ✓ · rows ≥ 3\",c:\"var(--api)\"},\n    {id:\"sse\",x:81.5,label:\"SSE\",sub:\"1 frame\",c:\"var(--sse)\"},\n    {id:\"hook\",x:94,label:\"hook → store\",sub:\"dispatch\",c:\"var(--react)\"}];\n  NODES.forEach(n=>{const d=document.createElement(\"div\");d.className=\"e2e-node\";d.id=\"e2e-\"+n.id;\n    d.style.left=n.x+\"%\";d.style.top=\"50%\";d.style.setProperty(\"--nc\",n.c);\n    d.innerHTML='<div class=\"en-box\"><b>'+n.label+\"<\u002Fb>\"+n.sub+\"<\u002Fdiv>\";track.appendChild(d);});\n  let ui8=mountMockUI($(\"#mockui-8\"),{controls:false,log:false});\n  const stats={in:0,frames:0,drops:0};\n  function drawStats(){$(\"#st-in\").textContent=stats.in;$(\"#st-frames\").textContent=stats.frames;\n    $(\"#st-drops\").textContent=stats.drops;$(\"#st-dispatch\").textContent=ui8.counts.dispatches;\n    $(\"#st-render\").textContent=ui8.counts.renders;}\n  function log(html,cls){const d=document.createElement(\"div\");d.className=\"dl \"+(cls||\"\");\n    d.innerHTML='<span class=\"ts\">'+fmtTime()+\"<\u002Fspan>\"+html;logEl.prepend(d);\n    while(logEl.children.length>40)logEl.lastChild.remove();}\n  let centers=[],edges=[];\n  function layout(){const tr=track.getBoundingClientRect();\n    centers=NODES.map(n=>{const r=$(\"#e2e-\"+n.id).getBoundingClientRect();\n      return{x:r.left-tr.left+r.width/2,y:r.top-tr.top+r.height/2};});\n    edges.forEach(e=>e.remove());edges=[];\n    for(let i=0;i<centers.length-1;i++){const a=centers[i],b=centers[i+1];\n      const e=document.createElement(\"div\");e.className=\"e2e-edge\";\n      const len=Math.hypot(b.x-a.x,b.y-a.y),ang=Math.atan2(b.y-a.y,b.x-a.x)*180/Math.PI;\n      e.style.cssText=\"left:\"+a.x+\"px;top:\"+a.y+\"px;width:\"+len+\"px;transform:rotate(\"+ang+\"deg)\";\n      track.insertBefore(e,track.firstChild);edges.push(e);}}\n  addEventListener(\"resize\",layout);layout();\n  const POOL=[\"smallRows\",\"smallRows\",\"seats\",\"theme\",\"smallRows\",\"revoke\",\"grant\",\"bigBatch\",\"combo\",\"theme\",\"seats\"];\n  const FILTER=u=>u.type===\"rows\"&&u.payload.length<3?\"rows batch \"+u.payload.length+\" < 3 — dropped\":null;\n  let playing=!REDUCED,speed=1,estepMode=false,spawnAcc=0,packets=[];\n  function pulse(id){const n=$(\"#e2e-\"+id);n.classList.add(\"pulse\");setTimeout(()=>n.classList.remove(\"pulse\"),420);}\n  function spawn(){\n    const raw=FRAMES[rand(POOL)]();\n    const deltas=Array.isArray(raw)?raw:[raw];\n    stats.in+=deltas.length;\n    log(\"produced <b>\"+deltas.map(d=>d.type).join(\" + \")+\"<\u002Fb> → kafka\",\"frame\");\n    pulse(\"prod\");pulse(\"kafka\");\n    const el=document.createElement(\"div\");el.className=\"e2e-pkt\";track.appendChild(el);\n    packets.push({el,deltas,seg:0,p:0});}\n  const SEGMS=340; // ms per hop at 1×\n  function advance(dt){\n    spawnAcc+=dt;\n    if(spawnAcc>1150){spawnAcc=0;spawn();}\n    packets=packets.filter(pk=>{\n      pk.p+=dt/SEGMS;\n      while(pk.p>=1&&pk.seg<centers.length-1){pk.p-=1;pk.seg++;arrive(pk);}\n      if(pk.dead){pk.el.remove();return false;}\n      const a=centers[pk.seg],b=centers[Math.min(pk.seg+1,centers.length-1)];\n      pk.el.style.left=(a.x+(b.x-a.x)*pk.p)+\"px\";pk.el.style.top=(a.y+(b.y-a.y)*pk.p)+\"px\";\n      return true;});\n    drawStats();}\n  makePace($(\"#e2e-pace\"),{\n    onSpeed:v=>{speed=v;},\n    onStepMode:on=>{estepMode=on;setStat();},\n    onStep:()=>advance(400)});\n  addLoop(slide,dt=>{if(!playing||estepMode)return;advance(dt*speed);});\n  function arrive(pk){\n    const node=NODES[pk.seg];if(!node)return;pulse(node.id);\n    if(node.id===\"norm\")log(\"normalize → <b>{type, payload, ts, origin}<\u002Fb>\");\n    if(node.id===\"redis\")log(\"<b>SMEMBERS<\u002Fb> subs:&lt;topic&gt; → 3 subscribers · no write\",\"\");\n    if(node.id===\"filt\"){\n      const kept=pk.deltas.filter(d=>!FILTER(d));\n      pk.deltas.filter(FILTER).forEach(d=>{stats.drops++;log(\"filtered out: <b>\"+esc(FILTER(d))+\"<\u002Fb>\",\"\");});\n      if(!kept.length){pk.dead=true;pk.el.style.opacity=\".25\";return; gEl.innerHTML=\"\";stB.classList.remove(\"bad\");\n    stB.textContent=\"waiting for the first frame…\";stA.textContent=\"connection open · nothing to render\";\n    clkA.textContent=\"0.0s\";clkB.textContent=\"0.0s\";\n    EV.forEach(e=>e._tick&&e._tick.classList.remove(\"on\"));\n    tbody.innerHTML='<tr><td colspan=\"3\" style=\"color:var(--faint)\">no rows yet — but the page is interactive<\u002Ftd><\u002Ftr>';\n    layout();kickoff();\n    $(\"#lq-run\").textContent=running?\"⏸ Pause\":\"▶ Play\";\n    $(\"#lq-stat\").textContent=\"streaming · time-compressed\";}\n  function tick(dt){\n    const landings=[];\n    clock=Math.min(TOTAL,clock+dt);\n    while(ix<EV.length&&clock>=EV[ix].t)emit(EV[ix++]);\n    pkts=pkts.filter(p=>{\n      p.p+=dt*1000/p.ms;\n      if(p.p>=1){p.el.remove();if(p.onArrive)landings.push(p.onArrive);return false;}\n      const x=p.from.x+(p.to.x-p.from.x)*p.p;\n      p.el.classList.toggle(\"near\",Math.abs(x-p.from.x)<34||Math.abs(x-p.to.x)<34);\n      p.el.style.left=x+\"px\";p.el.style.top=p.from.y+\"px\";return true;});\n    landings.forEach(fn=>fn());\n    for(let i=hots.length-1;i>=0;i--)if(clock>=hots[i].at){hots[i].n.classList.remove(\"pulse\");hots.splice(i,1);}\n    clkA.textContent=clock.toFixed(1)+\"s\";clkB.textContent=clock.toFixed(1)+\"s\";\n    renderBlocking();}\n  addLoop(slide,dt=>{\n    if(!running||cancelled)return;\n    tick(dt/1000*SPEED*pace);\n    if(clock>=TOTAL&&!pkts.length){running=false;$(\"#lq-run\").textContent=\"▶ Replay\";\n      $(\"#lq-stat\").textContent=\"both finished at 41.8s — one of them was useful the whole time\";}});\n  addEventListener(\"resize\",()=>{if(geo.length)layout();});\n  $(\"#lq-run\").addEventListener(\"click\",()=>{\n    if((clock>=TOTAL&&!pkts.length)||cancelled){reset();running=true;$(\"#lq-run\").textContent=\"⏸ Pause\";return;}\n    running=!running;$(\"#lq-run\").textContent=running?\"⏸ Pause\":\"▶ Play\";});\n  $(\"#lq-reset\").addEventListener(\"click\",()=>{reset();running= \");w(el,\"cont\",\"Accept: text/event-stream\");}\n\n  /* ── the \"server's\" index — none of this ships to the browser in real life ── */\n  const DB=[\n    {n:\"Acme Inc.\",         m:\"US · parent account\",     t:\"recent\"},\n    {n:\"Acme Nordics AB\",   m:\"4 open invoices · 2h ago\",t:\"recent\"},\n    {n:\"Nordea Bank Abp\",   m:\"FI · 3 open cases\",       t:\"recent\"},\n    {n:\"Acme Norway AS\",    m:\"org 913 442 118\",         t:\"index\"},\n    {n:\"Acme Northeast LLC\",m:\"org 55-2210\",             t:\"index\"},\n    {n:\"Acme Retail Ltd\",   m:\"GB · 12 seats\",           t:\"index\"},\n    {n:\"Northwind Traders\", m:\"NL · dormant\",            t:\"index\"},\n    {n:\"Norsk Hydro ASA\",   m:\"NO · enterprise\",         t:\"index\"},\n    {n:\"Globex Nordics\",    m:\"SE · trial\",              t:\"index\"},\n    {n:\"ACME North America\",m:\"aliased → Acme Inc.\",     t:\"fuzzy\"},\n    {n:\"Umbrella Norge\",    m:\"NO · churned 2024\",       t:\"fuzzy\"},\n    {n:\"Pied Piper Nord\",   m:\"DK · 2 seats\",            t:\"fuzzy\"}];\n  const TIER=[{k:\"recent\",src:\"recent · warm cache\",at:120,ms:\"12ms\"},\n              {k:\"index\", src:\"index · postgres trigram\",at:340,ms:\"186ms\"},\n              {k:\"fuzzy\", src:\"fuzzy · alias table\",at:760,ms:\"594ms\"}];\n  const norm=s=>s.toLowerCase().replace(/\\s+/g,\" \").trim();\n  function matches(q,e){\n    const terms=norm(q).split(\" \").filter(Boolean);if(!terms.length)return false;\n    const words=norm(e.n).split(/[^a-z0-9]+/).filter(Boolean);\n    return terms.every(t=>words.some(w=>w.startsWith(t))||norm(e.n).indexOf(t)>-1);}\n\n  let qTok=0;\n  async function suggest(q){\n    const my=++qTok;results.innerHTML=\"\";\n    if(!norm(q)){footA.textContent=\"idle · no request in flight\";wclear(wireA,\"nothing on the wire yet\");return;}\n    wclear(wireA);\n    if(norm(q).length>1)w(wireA,\"cont\",\"// previous stream closed — es.close()\");\n    req(wireA,\"GET /suggest?q=\"+esc(encode =1?\"\":\"s\")+\", 898ms<\u002Fb> — first pixels at 120ms\";}\n\n  /* ── validation: the rules live here, never in the browser ── */\n  const RULES={\n    email:[{at:60,k:\"syntax\",label:\"syntax · RFC 5322\",\n            run:v=>/^[^@\\s]+@[^@\\s]+\\.[a-z]{2,}$/i.test(v)?[\"ok\",\"syntax · RFC 5322\"]:[\"bad\",\"syntax — not a valid address\"]},\n           {at:480,k:\"mx\",label:\"MX record for the domain\",\n            run:v=>[\"lovelace.io\",\"acme.com\",\"hooli.com\",\"globex.se\"].indexOf((v.split(\"@\")[1]||\"\").toLowerCase())>-1\n              ?[\"ok\",\"MX record for \"+(v.split(\"@\")[1]||\"\")]:[\"bad\",\"no MX record for \"+((v.split(\"@\")[1]||\"—\"))]},\n           {at:900,k:\"unique\",label:\"not already registered\",\n            run:v=>/^(admin|root|billing)@/i.test(v)?[\"bad\",\"that address already has an account\"]:[\"ok\",\"not already registered\"]}],\n    vat:[{at:70,k:\"format\",label:\"format · GB country rule\",\n          run:v=>/^gb-\\d{4}-\\d{2}$/i.test(v)?[\"ok\",\"format · GB country rule\"]:[\"bad\",\"format — expected GB-0000-00\"]},\n         {at:1500,k:\"hmrc\",label:\"HMRC lookup\",\n          run:v=>/11$/.test(v)?[\"bad\",\"HMRC — not registered for VAT since 2021-04\"]:[\"ok\",\"HMRC — registered, active\"]}],\n    seats:[{at:60,k:\"range\",label:\"integer, 1–500\",\n            run:v=>/^\\d+$/.test(v)&&+v>=1&&+v<=500?[\"ok\",\"integer, 1–500\"]:[\"bad\",\"must be a whole number, 1–500\"]},\n           {at:560,k:\"plan\",label:\"within your plan\",\n            run:v=>+v>10?[\"warn2\",\"over your 10-seat plan · +£\"+((+v-10)*8)+\"/mo\"]:[\"ok\",\"within your 10-seat plan\"]}]};\n  const MK={pending:\"◌\",ok:\"✓\",bad:\"✗\",warn2:\"△\",skip:\"›\"};\n  function ruleRow(text,state){const r=document.createElement(\"div\");r.className=\"sv-rule \"+state;\n    r.innerHTML='<span class=\"mk\">'+MK[state]+'<\u002Fspan><span>'+esc(text)+\"<\u002Fspan>\";return r;}\n  const fields=$$(\"#sv-form .sv-field\").map(el=>({el,id:el.dataset.f,input:$(\"input\",el),rules:$(\".sv-rules\",el),tok:0}));\n  async function validate(f){\n    const my=++f.tok,v=f.input.value.trim();\n    f.el.className=\"sv-field\";f.rules.innerHTML=\"\";\n    if(!v){footB.textContent=\"idle · the browser holds no rules\";wclear(wireB,\"nothing on the wire yet\");return;}\n    f.el.classList.add(\"pending\");\n    const spec=RULES[f.id],rows=spec.map(r=>{const el=ruleRow(r.label+\" …\",\"pending\");f.rules.appendChild(el);return el;});\n    wclear(wireB);\n    req(wireB,\"GET /validate/checkout?\"+esc(f.id)+\"=\"+esc(encodeURIComponent(v)));\n    footB.innerHTML=\"stream closed → <b>GET /validate/checkout?\"+esc(f.id)+\"=…<\u002Fb>\";\n    let t=0,worst=\"ok\";\n    for(let i=0;i<spec.length;i++){\n      await sleep(spec[i].at-t);t=spec[i].at;if(f.tok!==my)return;\n      const [tone,text]=spec[i].run(v);\n      rows[i].replaceWith(ruleRow(text,tone));\n      w(wireB,\"res \"+(tone===\"bad\"?\"no\":tone===\"ok\"?\"yes\":\"\"),\"<b>event: rule<\u002Fb>\");\n      w(wireB,\"cont\",'data: {\"field\":\"'+esc(f.id)+'\",\"rule\":\"'+esc(spec[i].k)+'\",\"ok\":'+(tone===\"bad\"?\"false\":\"true\")+\n        (tone===\"ok\"?\"\":',\"msg\":\"'+esc(text)+'\"')+\"}\");\n      footB.innerHTML=\"event: rule · <b>\"+esc(f.id)+\"<\u002Fb> — \"+(tone===\"ok\"?\"passed\":tone===\"bad\"?\"failed\":\"warning\")+\", streamed the moment it resolved\";\n      if(tone===\"bad\"){worst=\"bad\";\n        for(let j=i+1;j<spec.length;j++)rows[j].replaceWith(ruleRow(spec[j].label+\" — skipped\",\"skip\"));\n        w(wireB,\"cont\",\"// first failure short-circuits — \"+(spec.length-i-1)+\" rule(s) never run\");\n        break;}\n      if(tone===\"warn2\"&&worst===\"ok\")worst=\"warn2\";}\n    if(f.tok!==my)return;\n    f.el.classList.remove(\"pending\");f.el.classList.add(worst);\n    w(wireB,\"res\",\"<b>event: done<\u002Fb>\");\n    w(wireB,\"cont\",'data: {\"field\":\"'+esc(f.id)+'\",\"status\":\"'+(worst===\"bad\"?\"blocking\":worst===\"warn2\"?\"advisory\":\"clean\")+'\"}');\n    footB.innerHTML=\"event: done · <b>\"+esc(f.id)+\" \"+(worst===\"bad\"?\"blocking\":worst===\"warn2\"?\"advisory\":\"clean\")+\n      \"<\u002Fb> — the submit button already knows\";}\n\n  qEl.addEventListener(\"input\",()=>{suggest(qEl.value);\n    stat.textContent=\"one stream per keystroke — the previous one is closed, so no stale reply can land\";});\n  fields.forEach(f=>f.input.addEventListener(\"input\",()=>{validate(f);\n    stat.textContent=\"every rule ran on the server; the client only rendered frames\";}));\n\n  let atTok=0;\n  async function type(el,text){const my=atTok;el.focus();el.value=\"\";\n    for(const ch of text){if(atTok!==my)return false;el.value+=ch;\n      el.dispatchEvent(new Event(\"input\"));await sleep(95);}\n    return atTok===my;}\n  $(\"#sv-play\").addEventListener(\"click\",async()=>{\n    const my=++atTok;\n    if(!await type(qEl,\"acme nor\"))return;\n    await sleep(950);if(atTok!==my)return;\n    for(const [i,txt] of [[0,\"ada@lovelace.io\"],[1,\"GB-8842-11\"],[2,\"12\"]]){\n      if(!await type(fields[i].input,txt))return;\n      await sleep(700);if(atTok!==my)return;}\n    stat.textContent=\"one endpoint per intent · partial answers first · cancel is just a closed stream\";});\n  $(\"#sv-clear\").addEventListener(\"click\",()=>{atTok++;\n    qEl.value=\"\";suggest(\"\");fields.forEach(f=>{f.input.value=\"\";validate(f);});\n    wclear(wireA,\"nothing on the wire yet\");wclear(wireB,\"nothing on the wire yet\");\n    stat.textContent=\"type in either panel — every keystroke opens a stream and closes the last one\";});\n})();\n/* companion demo: inlined blob when bundled, sibling file when not */\n(function(){const f=$(\"#demo-frame\");if(!f)return;\n  f.src=(window.__resources&&window.__resources.demoApp)||f.dataset.src;})();\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
